title: Capital TFLL37
tagline: Malwares, obfuscation, automation, LLMs?, exploitation
description: >-
  Cybersecurity research blog focusing on malware analysis,
  reverse engineering, CTF writeups, and vulnerability research
  by TFLL37.

url: "https://tfll37.github.io"
baseurl: ""

author:
  name: TFLL37
  email: example@domain.com

# Social links (used by Minima and SEO)
social:
  name: TFLL37
  links:
    - https://github.com/tfll37
    - https://x.com/dingototh

# Google Analytics (GA4)
google_analytics: G-G76T8KMRM4

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate

# Pagination (classic Minima style)
paginate: 10
paginate_path: "/page:num/"

# Permalinks for posts (kept from previous setup for URL stability)
permalink: /posts/:title/

# Keep posts with future dates if needed
future: true

# Timezone
timezone: Europe/Prague

# Kramdown / syntax highlighting (works well with Minima)
kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# Defaults for posts
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

sass:
  style: compressed

# HTML compression (optional but harmless)
compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

# Files to exclude from build
exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"
  - mcps/
